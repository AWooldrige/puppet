#########################################################################
##   This file is controlled by Puppet - changes will be overwritten   ##
#########################################################################
#
# Per-client authorisation for the mTLS ingress, keyed on the client certificate.

# Intentionally empty. Add a line to revoke a stolen or compromised device
map $ssl_client_s_dn $client_blocked {
    default                        0;
}

# Interactive machines only.
map $ssl_client_s_dn $wiki_allowed {
    default                        0;

    ~^CN=lendh1(,|$)               1;   # main desktop
    ~^CN=ltpdh1(,|$)               1;   # laptop
    ~^CN=ltpdh2(,|$)               1;   # laptop
    ~^CN=hplaptop2(,|$)            1;   # laptop
    ~^CN=pxlmh1(,|$)               1;   # phone
    ~^CN=websh1(,|$)               1;   # the server itself (backups, checks)
}
